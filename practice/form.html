<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 102vh;
            margin: 0;
            background-color: #e1e9f1;
        }

        .box {
            background-color: white;
            padding: 25px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        #button {
            color: rgb(15, 65, 65);
        }
        
    </style>
</head>

<body>

<div class="box">
    <h3 style="color:rgb(90, 170, 144);">Student Registration Form</h3>
    <form action="" method="post" enctype="multipart/form-data" onsubmit="return alertMessage()">
        <label >Name:</label><br>
        <input type="text" id="name" placeholder="John Abraham"><br><br>
        <label>Email:</label><br>
        <input type="email" id="email" placeholder="john12@gmail.com"><br><br>
        <label>Password:</label><br>
        <input type="password" id="pwd" placeholder="password"><br><br>
        <input type="file" id="file"><br><br>
        <input type="checkbox" id="check">
        <label>I agree to the terms and conditions</label><br><br>
        <input type="radio" name="gender" value="male"> Male<br><br>
        <input type="radio" name="gender" value="female"> Female<br><br>
        <input type="radio" name="gender" value="other"> Other<br><br>
        <input type="radio" name="gender" value="prefer_not_say"> Prefer not to say<br><br> 
        <input type="submit" value="Submit" id="button">
    </form>
</div>
<script>
function alertMessage() {
    alert("Thank you for submission!");
    return false;
}
</script>
</body>
</html>
